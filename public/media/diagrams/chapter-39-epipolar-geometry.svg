<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Geometri Epipolar pada Stereo Vision</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Garis Epipolar, Epipole, Bidang Epipolar, dan Matriks Fundamental F</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- Left & Right Cameras -->
        <circle cx="140" cy="180" r="6" fill="#38bdf8"/>
        <text x="120" y="205" fill="#38bdf8" font-size="12">Kamera O_L</text>
        <circle cx="560" cy="180" r="6" fill="#818cf8"/>
        <text x="540" y="205" fill="#818cf8" font-size="12">Kamera O_R</text>
        <!-- Baseline -->
        <line x1="140" y1="180" x2="560" y2="180" stroke="#fbbf24" stroke-width="2"/>
        <text x="330" y="170" fill="#fbbf24" font-size="12">Baseline B</text>
        <!-- 3D point X -->
        <circle cx="350" cy="60" r="6" fill="#34d399"/>
        <text x="340" y="45" fill="#34d399" font-size="12">X (3D)</text>
        <line x1="140" y1="180" x2="350" y2="60" stroke="#38bdf8" stroke-dasharray="3"/>
        <line x1="560" y1="180" x2="350" y2="60" stroke="#818cf8" stroke-dasharray="3"/>
        <!-- Formula -->
        <text x="240" y="235" fill="#f8fafc" font-family="monospace" font-size="13">Batasan Epipolar: x_R^T · F · x_L = 0</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>