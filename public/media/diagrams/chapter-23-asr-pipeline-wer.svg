  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chapter 23: Acoustic Model, Language Model, dan Penghitungan Word Error Rate | Multimedia &amp; Computer Vision Hub - ITERA</text>

  <!-- Main Graphical Content -->
  
      <g transform="translate(60, 120)">
