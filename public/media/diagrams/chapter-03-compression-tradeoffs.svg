<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgComp)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Lossless vs Lossy Compression &amp; Rate-Distortion Curve</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Trade-off antara ukuran berkas penyimpanan (Bitrate) vs kualitas persepsi visual (PSNR / SSIM)</text>

  <!-- Left: Comparison Table Card -->
  <g transform="translate(45, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Perbandingan Paradigma Kompresi</text>

    <!-- Sub-card 1: Lossless -->
    <g transform="translate(20, 50)">
      <rect width="375" height="75" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="15" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Lossless Compression (Tanpa Kehilangan Data)</text>
      <text x="15" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Dekompresi menghasilkan bit yang 100% identik dengan sumber asli.</text>
      <text x="15" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; <strong fill="#cbd5e1">Rasio Kompresi:</strong> 1.5:1 &#8212; 3:1 | <strong fill="#cbd5e1">Contoh:</strong> PNG, FLAC, ZIP, TIFF LZW.</text>
    </g>

    <!-- Sub-card 2: Lossy -->
    <g transform="translate(20, 135)">
      <rect width="375" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Lossy Compression (Kompresi Berkorban Persepsi)</text>
      <text x="15" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Menghapus frekuensi tinggi yang tidak tertangkap oleh mata/telinga manusia.</text>
      <text x="15" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; <strong fill="#cbd5e1">Rasio Kompresi:</strong> 10:1 &#8212; 100:1 | <strong fill="#cbd5e1">Contoh:</strong> JPEG, MP3, H.264, WebP, AV1.</text>
    </g>

    <text x="205" y="230" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prinsip Shannon: Batas entropi teoritis H(X) membatasi kompresi lossless</text>
  </g>

  <!-- Right: Rate-Distortion Chart -->
  <g transform="translate(500, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Kurva Rate-Distortion (R-D Curve)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Perbandingan efisiensi codec modern (AV1 &gt; HEVC &gt; AVC)</text>

    <!-- Chart Axes -->
    <line x1="45" y1="205" x2="380" y2="205" stroke="#475569" stroke-width="1.5"/>
    <line x1="45" y1="65" x2="45" y2="205" stroke="#475569" stroke-width="1.5"/>
    <text x="375" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Bitrate / File Size (kbps)</text>
    <text x="50" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kualitas Persepsi (PSNR dB / SSIM)</text>

    <!-- Curve 1: AV1 / HEVC (High efficiency green) -->
    <path d="M 55 195 Q 120 95, 360 85" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="320" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AV1 / H.265</text>

    <!-- Curve 2: H.264 AVC (Mid efficiency blue) -->
    <path d="M 65 200 Q 150 120, 360 110" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="320" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">H.264 / AVC</text>

    <!-- Curve 3: Legacy MPEG-2 (Low efficiency red) -->
    <path d="M 85 205 Q 200 155, 360 145" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="320" y="160" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">Legacy MPEG-2</text>

    <text x="210" y="230" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">AV1 menghemat ~50% bitrate untuk kualitas visual setara H.264</text>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

