<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="360" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 09 · CLAHE LOCAL TILES &amp; CLIP LIMIT</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Mekanisme CLAHE (Contrast Limited Adaptive Histogram Equalization)</text>

  <!-- Tile Grid -->
  <g transform="translate(60, 120)">
    <rect width="200" height="180" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5">
      <line x1="50" y1="0" x2="50" y2="180" /><line x1="100" y1="0" x2="100" y2="180" /><line x1="150" y1="0" x2="150" y2="180" />
      <line x1="0" y1="45" x2="200" y2="45" /><line x1="0" y1="90" x2="200" y2="90" /><line x1="0" y1="135" x2="200" y2="135" />
    </g>
    <rect x="50" y="45" width="50" height="45" fill="#34d399" fill-opacity="0.35" stroke="#34d399" stroke-width="2" />
    <text x="100" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1. Bagi Citra Menjadi Ubin (Tiles)</text>
  </g>

  <!-- Clip & Redistribute -->
  <g transform="translate(330, 120)">
    <rect width="260" height="180" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="40" y="95" width="22" height="55" fill="#38bdf8" />
    <rect x="75" y="95" width="22" height="55" fill="#38bdf8" />
    <rect x="75" y="45" width="22" height="50" fill="#ef4444" fill-opacity="0.6" stroke="#ef4444" stroke-dasharray="3,2" />
    <rect x="115" y="95" width="22" height="55" fill="#38bdf8" />
    <rect x="160" y="115" width="22" height="35" fill="#34d399" />
    <line x1="25" y1="95" x2="230" y2="95" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" />
    <text x="185" y="88" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">Clip Limit</text>
    <text x="130" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">2. Potong Puncak &amp; Redistribusi Merata</text>
  </g>

  <!-- Bilinear Interpolation -->
  <g transform="translate(650, 120)">
    <rect width="250" height="180" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <circle cx="70" cy="55" r="7" fill="#38bdf8" />
    <circle cx="180" cy="55" r="7" fill="#38bdf8" />
    <circle cx="70" cy="125" r="7" fill="#38bdf8" />
    <circle cx="180" cy="125" r="7" fill="#38bdf8" />
    <circle cx="125" cy="90" r="8" fill="#f59e0b" />
    <line x1="70" y1="55" x2="125" y2="90" stroke="#94a3b8" stroke-dasharray="3,2" />
    <line x1="180" y1="55" x2="125" y2="90" stroke="#94a3b8" stroke-dasharray="3,2" />
    <line x1="70" y1="125" x2="125" y2="90" stroke="#94a3b8" stroke-dasharray="3,2" />
    <line x1="180" y1="125" x2="125" y2="90" stroke="#94a3b8" stroke-dasharray="3,2" />
    <text x="125" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">3. Interpolasi Bilinear Antar Batas Tile</text>
  </g>
  <text x="924" y="346" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
