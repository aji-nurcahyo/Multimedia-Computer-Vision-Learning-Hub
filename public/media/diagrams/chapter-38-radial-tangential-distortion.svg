<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Distorsi Lensa Kamera: Radial & Tangensial</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Model Distorsi Brown-Conrady: Barrel, Pincushion, dan Rektifikasi</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(60, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="bold">Distorsi Radial (Barrel vs Pincushion)</text>
        <!-- Barrel shape -->
        <path d="M 60,80 Q 140,65 220,80 Q 235,140 220,200 Q 140,215 60,200 Q 45,140 60,80" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <text x="100" y="145" fill="#fbbf24" font-size="11">Barrel (k1 &lt; 0)</text>
        <text x="20" y="240" fill="#94a3b8" font-size="11">r_dist = r(1 + k1·r² + k2·r⁴)</text>
      </g>
      <g transform="translate(420, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="bold">Distorsi Tangensial (Sensor Tilt)</text>
        <rect x="50" y="80" width="160" height="120" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-6, 130, 140)"/>
        <text x="60" y="140" fill="#38bdf8" font-size="11">Ketidaksejajaran Lensa-Sensor</text>
        <text x="20" y="240" fill="#94a3b8" font-size="11">Parameter p1, p2 dalam cv2.calibrateCamera</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>