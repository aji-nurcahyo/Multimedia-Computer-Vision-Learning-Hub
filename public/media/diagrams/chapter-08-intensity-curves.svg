<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <rect width="960" height="390" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 08 · INTENSITY TRANSFORMATION CURVES</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Kurva Pemetaan Titik Intensitas s = T(r): Negative, Log &amp; Gamma</text>

  <!-- Coordinate Plot -->
  <g transform="translate(80, 125)">
    <rect width="260" height="210" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <!-- Identity -->
    <line x1="0" y1="210" x2="260" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" />
    <!-- Negative -->
    <line x1="0" y1="0" x2="260" y2="210" stroke="#ef4444" stroke-width="2.5" />
    <!-- Gamma < 1 (Log-like brightening) -->
    <path d="M 0 210 Q 50 40 260 0" fill="none" stroke="#34d399" stroke-width="2.5" />
    <!-- Gamma > 1 (Darkening) -->
    <path d="M 0 210 Q 210 175 260 0" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <text x="130" y="232" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Input Intensity r ∈ [0, 255]</text>
    <text x="-18" y="105" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle" transform="rotate(-90,-18,105)">Output s</text>
  </g>

  <!-- Legend / Equations -->
  <g transform="translate(400, 125)">
    <rect width="510" height="210" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="24" y="38" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">● Gamma &lt; 1 &amp; Log Transform (Mencerahkan Gelap)</text>
    <text x="40" y="60" fill="#cbd5e1" font-family="monospace" font-size="12">s = c · log(1 + r)   |   s = c · r^γ  (γ &lt; 1, mis. 0.4)</text>

    <text x="24" y="98" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="700">● Gamma &gt; 1 (Menggelapkan &amp; Menambah Kontras)</text>
    <text x="40" y="120" fill="#cbd5e1" font-family="monospace" font-size="12">s = c · r^γ  (γ &gt; 1, mis. 2.2 untuk koreksi CRT)</text>

    <text x="24" y="158" fill="#ef4444" font-family="monospace" font-size="14" font-weight="700">● Image Negative (Membalik Polaritas Intensitas)</text>
    <text x="40" y="180" fill="#cbd5e1" font-family="monospace" font-size="12">s = (L - 1) - r = 255 - r (Citra medis X-ray/mammogram)</text>
  </g>
  <text x="924" y="372" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
