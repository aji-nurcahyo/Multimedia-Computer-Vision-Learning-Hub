<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 13 · CANNY EDGE DETECTION PIPELINE</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Alur Algoritma Canny Edge Detector (4 Tahap Optimal)</text>

  <g transform="translate(45, 130)">
    <rect width="195" height="125" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="98" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Gaussian Blur</text>
    <text x="98" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Reduksi derau frekuensi</text>
    <text x="98" y="84" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">tinggi sebelum turunan</text>
  </g>
  <text x="255" y="195" fill="#38bdf8" font-family="monospace" font-size="18" text-anchor="middle">→</text>

  <g transform="translate(270, 130)">
    <rect width="195" height="125" rx="8" fill="#1e293b" stroke="#f59e0b" />
    <text x="98" y="34" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Sobel Gradients</text>
    <text x="98" y="64" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">M = √(Gx² + Gy²)</text>
    <text x="98" y="86" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">θ = atan2(Gy, Gx)</text>
  </g>
  <text x="480" y="195" fill="#38bdf8" font-family="monospace" font-size="18" text-anchor="middle">→</text>

  <g transform="translate(495, 130)">
    <rect width="195" height="125" rx="8" fill="#1e293b" stroke="#a78bfa" />
    <text x="98" y="34" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Non-Max Suppression</text>
    <text x="98" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Menipiskan punggungan</text>
    <text x="98" y="84" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">menjadi tepi 1 piksel</text>
  </g>
  <text x="705" y="195" fill="#38bdf8" font-family="monospace" font-size="18" text-anchor="middle">→</text>

  <g transform="translate(720, 130)">
    <rect width="195" height="125" rx="8" fill="#1e293b" stroke="#34d399" />
    <text x="98" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Hysteresis</text>
    <text x="98" y="64" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">T_low ≤ M &lt; T_high</text>
    <text x="98" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Pertahankan tepi terhubung</text>
  </g>

  <text x="924" y="342" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
