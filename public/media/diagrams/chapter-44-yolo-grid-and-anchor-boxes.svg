<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Arsitektur Grid & Anchor Box Deteksi Objek YOLO</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Prediksi Simultan Koordinat Bounding Box, Skor Objectness, dan Kelas</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- S x S Grid -->
        <rect x="40" y="50" width="160" height="160" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="80" y1="50" x2="80" y2="210" stroke="#334155"/>
        <line x1="120" y1="50" x2="120" y2="210" stroke="#334155"/>
        <line x1="160" y1="50" x2="160" y2="210" stroke="#334155"/>
        <line x1="40" y1="90" x2="200" y2="90" stroke="#334155"/>
        <line x1="40" y1="130" x2="200" y2="130" stroke="#334155"/>
        <line x1="40" y1="170" x2="200" y2="170" stroke="#334155"/>
        <rect x="80" y="90" width="40" height="40" fill="#f43f5e" fill-opacity="0.4"/>
        <text x="50" y="235" fill="#38bdf8" font-size="11">Grid Sel S x S (Pusat Objek)</text>
        <!-- Vector Output -->
        <rect x="250" y="60" width="410" height="140" rx="6" fill="#0f172a" stroke="#818cf8"/>
        <text x="270" y="90" fill="#818cf8" font-size="13" font-weight="bold">Tensor Output Setiap Grid Sel B x (5 + C):</text>
        <text x="280" y="125" fill="#e2e8f0" font-family="monospace" font-size="12">
          [ t_x, t_y, t_w, t_h, Objectness_Conf, P(C_1) ... P(C_k) ]
        </text>
        <text x="280" y="165" fill="#94a3b8" font-size="11">
          Bounding Box aktual: b_x = σ(t_x) + c_x, b_w = p_w · exp(t_w)
        </text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>