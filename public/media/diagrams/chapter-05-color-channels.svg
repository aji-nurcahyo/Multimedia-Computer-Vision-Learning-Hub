<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgCol)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">RGB Channel Decomposition &amp; OpenCV BGR Convention</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Pemisahan matriks tensor 3D citra menjadi tiga matriks intensitas 2D independen [Red, Green, Blue]</text>

  <!-- Left: Composite RGB Image -->
  <g transform="translate(60, 110)">
    <rect width="210" height="225" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="30" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Citra Komposit Penuh (RGB)</text>
    
    <!-- Visual Image simulation -->
    <g transform="translate(30, 45)">
      <rect width="150" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="55" cy="55" r="35" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="95" cy="55" r="35" fill="#10b981" fill-opacity="0.8"/>
      <circle cx="75" cy="85" r="35" fill="#3b82f6" fill-opacity="0.8"/>
    </g>

    <text x="105" y="185" fill="#7dd3fc" font-family="monospace" font-size="11" text-anchor="middle">Shape: (H, W, 3)</text>
    <text x="105" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TrueColor 24-bit per piksel</text>
  </g>

  <!-- Splitting Arrows -->
  <g transform="translate(290, 175)">
    <path d="M 0 45 L 45 -45 M 0 45 L 45 45 M 0 45 L 45 135" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="-5" y="40" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">Split</text>
  </g>

  <!-- Right: 3 Separated Channel Planes -->
  <g transform="translate(355, 100)">
    <!-- Red Channel -->
    <g transform="translate(0, 0)">
      <rect width="165" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#7f1d1d" fill-opacity="0.4"/>
      <text x="15" y="17" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">R: Red Channel</text>
      <text x="15" y="42" fill="#cbd5e1" font-family="monospace" font-size="10">img[:, :, 0] (RGB)</text>
      <text x="15" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Intensitas merah monokrom</text>
    </g>

    <!-- Green Channel -->
    <g transform="translate(0, 85)">
      <rect width="165" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#064e3b" fill-opacity="0.4"/>
      <text x="15" y="17" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="700">G: Green Channel</text>
      <text x="15" y="42" fill="#cbd5e1" font-family="monospace" font-size="10">img[:, :, 1] (RGB)</text>
      <text x="15" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Intensitas hijau (luminansi tinggi)</text>
    </g>

    <!-- Blue Channel -->
    <g transform="translate(0, 170)">
      <rect width="165" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="24" rx="8" fill="#1e3a8a" fill-opacity="0.4"/>
      <text x="15" y="17" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">B: Blue Channel</text>
      <text x="15" y="42" fill="#cbd5e1" font-family="monospace" font-size="10">img[:, :, 2] (RGB)</text>
      <text x="15" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Intensitas biru monokrom</text>
    </g>
  </g>

  <!-- OpenCV vs Matplotlib Warning Box -->
  <g transform="translate(545, 110)">
    <rect width="360" height="225" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="32" rx="10" fill="#78350f" fill-opacity="0.3"/>
    <text x="180" y="21" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">&#9888; CRITICAL: OpenCV BGR vs Matplotlib RGB</text>

    <g transform="translate(20, 48)">
      <text x="0" y="16" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Secara default, cv2.imread() memuat citra dalam BGR:</text>
      <text x="0" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Channel 0 = Blue, Channel 1 = Green, Channel 2 = Red.</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Jika langsung di-plot dengan plt.imshow(), warna akan tertukar!</text>
      <text x="0" y="75" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">(Wajah manusia menjadi biru / alien artifact).</text>

      <rect x="0" y="90" width="320" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="112" fill="#34d399" font-family="monospace" font-size="10"># Konversi Wajib Sebelum Plot Matplotlib:</text>
      <text x="12" y="132" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">img_rgb = cv2.cvtColor(img_bgr, cv2.COLOR_BGR2RGB)</text>
    </g>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

