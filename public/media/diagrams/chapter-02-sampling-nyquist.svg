<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgSamp)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Nyquist-Shannon Sampling Theorem &amp; Aliasing Phenomenon</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Prinsip diskretisasi sinyal kontinu: fs &#8805; 2 fmax untuk rekonstruksi sempurna tanpa distorsi aliasing</text>

  <!-- Left: Proper Sampling (fs >= 2 fmax) -->
  <g transform="translate(45, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">A. Sampling Memenuhi Syarat Nyquist (fs = 8 f0)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Frekuensi sinyal f0 = 2 Hz, Frekuensi sampling fs = 16 Hz &#8805; 2(2) Hz</text>

    <!-- Axis -->
    <line x1="30" y1="140" x2="385" y2="140" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="65" x2="30" y2="215" stroke="#475569" stroke-width="1"/>

    <!-- Continuous wave (faint blue) -->
    <path d="M 30 140 Q 60 70, 90 140 T 150 140 T 210 140 T 270 140 T 330 140 T 385 140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Sample stems -->
    <g stroke="#34d399" stroke-width="2">
      <!-- 16 sample points across 3 cycles -->
      <line x1="30" y1="140" x2="30" y2="140"/><circle cx="30" cy="140" r="3.5" fill="#34d399"/>
      <line x1="45" y1="140" x2="45" y2="90"/><circle cx="45" cy="90" r="3.5" fill="#34d399"/>
      <line x1="60" y1="140" x2="60" y2="70"/><circle cx="60" cy="70" r="3.5" fill="#34d399"/>
      <line x1="75" y1="140" x2="75" y2="90"/><circle cx="75" cy="90" r="3.5" fill="#34d399"/>
      <line x1="90" y1="140" x2="90" y2="140"/><circle cx="90" cy="140" r="3.5" fill="#34d399"/>
      <line x1="105" y1="140" x2="105" y2="190"/><circle cx="105" cy="190" r="3.5" fill="#34d399"/>
      <line x1="120" y1="140" x2="120" y2="210"/><circle cx="120" cy="210" r="3.5" fill="#34d399"/>
      <line x1="135" y1="140" x2="135" y2="190"/><circle cx="135" cy="190" r="3.5" fill="#34d399"/>
      <line x1="150" y1="140" x2="150" y2="140"/><circle cx="150" cy="140" r="3.5" fill="#34d399"/>
      <line x1="165" y1="140" x2="165" y2="90"/><circle cx="165" cy="90" r="3.5" fill="#34d399"/>
      <line x1="180" y1="140" x2="180" y2="70"/><circle cx="180" cy="70" r="3.5" fill="#34d399"/>
      <line x1="195" y1="140" x2="195" y2="90"/><circle cx="195" cy="90" r="3.5" fill="#34d399"/>
      <line x1="210" y1="140" x2="210" y2="140"/><circle cx="210" cy="140" r="3.5" fill="#34d399"/>
      <line x1="270" y1="140" x2="270" y2="140"/><circle cx="270" cy="140" r="3.5" fill="#34d399"/>
      <line x1="330" y1="140" x2="330" y2="140"/><circle cx="330" cy="140" r="3.5" fill="#34d399"/>
    </g>

    <text x="205" y="225" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&#10004; Rekonstruksi Sempurna: Bentuk gelombang asli terpulihkan 100%</text>
  </g>

  <!-- Right: Undersampling / Aliasing (fs < 2 fmax) -->
  <g transform="translate(500, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">B. Undersampling &amp; Aliasing (fs = 1.33 f0 &lt; 2 f0)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Frekuensi sinyal f0 = 2 Hz, Frekuensi sampling fs = 2.67 Hz (Terlalu lambat)</text>

    <!-- Axis -->
    <line x1="30" y1="140" x2="385" y2="140" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="65" x2="30" y2="215" stroke="#475569" stroke-width="1"/>

    <!-- High-freq original (faint gray) -->
    <path d="M 30 140 Q 60 70, 90 140 T 150 140 T 210 140 T 270 140 T 330 140 T 385 140" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Few sparse samples -->
    <circle cx="30" cy="140" r="4.5" fill="#ef4444"/>
    <circle cx="120" cy="210" r="4.5" fill="#ef4444"/>
    <circle cx="210" cy="140" r="4.5" fill="#ef4444"/>
    <circle cx="300" cy="70" r="4.5" fill="#ef4444"/>

    <!-- False Aliased wave (dashed red) -->
    <path d="M 30 140 Q 120 280, 210 140 T 385 140" fill="none" stroke="#ef4444" stroke-width="2.5"/>

    <text x="205" y="210" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&#10008; Terjadi Aliasing: Terdeteksi sebagai gelombang frekuensi palsu yang lebih rendah!</text>
    <text x="205" y="228" fill="#f87171" font-family="monospace" font-size="10" text-anchor="middle">f_alias = |f0 - fs| = |2 - 2.67| = 0.67 Hz</text>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

