<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 08 · PIECEWISE CONTRAST STRETCHING</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Transformasi Linear Bertahap (Piecewise Contrast Stretching)</text>

  <g transform="translate(80, 120)">
    <rect width="240" height="190" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="190" x2="70" y2="165" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="70" y1="165" x2="170" y2="25" stroke="#34d399" stroke-width="3" />
    <line x1="170" y1="25" x2="240" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="70" cy="165" r="5" fill="#f59e0b" />
    <circle cx="170" cy="25" r="5" fill="#f59e0b" />
    <text x="72" y="182" fill="#f59e0b" font-family="monospace" font-size="11">(r₁, s₁)</text>
    <text x="135" y="20" fill="#f59e0b" font-family="monospace" font-size="11">(r₂, s₂)</text>
  </g>

  <g transform="translate(380, 120)">
    <rect width="530" height="190" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="24" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Formula Normalisasi Min–Max &amp; Peregangan</text>
    <text x="24" y="72" fill="#f8fafc" font-family="monospace" font-size="14">s = ((r - r_min) / (r_max - r_min)) × 255</text>
    <text x="24" y="108" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">1. Menjaga nilai di luar [r₁, r₂] tetap terkompresi.</text>
    <text x="24" y="136" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">2. Gradien curam di tengah [r₁, r₂] memperbesar selisih intensitas.</text>
    <text x="24" y="164" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">3. Memanfaatkan seluruh rentang dinamis [0..255] secara penuh.</text>
  </g>
  <text x="924" y="344" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
