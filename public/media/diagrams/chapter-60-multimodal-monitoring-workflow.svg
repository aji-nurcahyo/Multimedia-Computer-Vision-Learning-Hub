<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Alur Kerja Verifikasi Insiden &amp; Respons Capstone Multimodal</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Diagram Keputusan: Dari Akuisisi Sinyal Sensorik hingga Verifikasi Insiden Multimodal &amp; Notifikasi</text>
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <g transform="translate(50, 110)">
    <!-- Event Trigger 1: Visual Object Detected -->
    <rect x="0" y="10" width="180" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="90" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. Deteksi Visual (S_v)</text>
    <text x="90" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Objek/Intruder Dikenali &gt; 0.5</text>

    <!-- Event Trigger 2: Acoustic Event -->
    <rect x="0" y="90" width="180" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" />
    <text x="90" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">2. Anomali Akustik (S_a)</text>
    <text x="90" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Lonjakan Suara / Alarm &gt; 0.5</text>

    <!-- Event Trigger 3: Context Sensor -->
    <rect x="0" y="170" width="180" height="65" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="90" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">3. Konteks Spasial (S_c)</text>
    <text x="90" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Zona Terbatas / Malam Hari</text>

    <!-- Connectors to Fusion Core -->
    <line x1="180" y1="42" x2="250" y2="122" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="180" y1="122" x2="250" y2="122" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="180" y1="202" x2="250" y2="122" stroke="#34d399" stroke-width="1.5" />

    <!-- Center: Fusion Node -->
    <rect x="250" y="60" width="190" height="125" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <text x="345" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Mesin Fusi Sensor</text>
    <text x="345" y="105" font-family="monospace" font-size="10" fill="#818cf8" text-anchor="middle">F = 0.6·S_v + 0.25·S_a + 0.15·S_c</text>
    <text x="345" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Evaluasi Ambang: F ≥ 0.50?</text>
    <rect x="265" y="140" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="345" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Temporal Hysteresis (3 frames)</text>

    <!-- Decision Arrow -->
    <line x1="440" y1="122" x2="495" y2="122" stroke="#818cf8" stroke-width="2" />
    <polygon points="495,122 487,117 487,127" fill="#818cf8" />

    <!-- Outcome Branch 1: High Alert (True Positive) -->
    <rect x="500" y="30" width="200" height="85" rx="6" fill="#065f46" stroke="#34d399" />
    <text x="600" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">✓ Insiden Terverifikasi (F ≥ 0.5)</text>
    <text x="600" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">• Rekam Snapshot Visual &amp; BBox</text>
    <text x="600" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">• Kirim Notifikasi &amp; Log Insiden</text>

    <!-- Outcome Branch 2: Suppressed False Alarm -->
    <rect x="500" y="130" width="200" height="85" rx="6" fill="#1e293b" stroke="#64748b" />
    <text x="600" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">✕ Redam False Alarm (F &lt; 0.5)</text>
    <text x="600" y="175" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• Gangguan Sensor Tunggal Diabaikan</text>
    <text x="600" y="195" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• Pertahankan Buffer Stabil</text>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(50, 360)">
    <rect width="700" height="55" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Ketahanan Sistem Monitoring Visual:</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Kombinasi modalitas visual sebagai pilar utama (bobot 60%) didukung audio dan konteks mampu mereduksi false alarm hingga lebih dari 65% dibanding deteksi visual tunggal.</text>
  </g>

  <text x="400" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Multimedia &amp; Computer Vision Learning Hub • Institut Teknologi Sumatera (ITERA)</text>
</svg>

