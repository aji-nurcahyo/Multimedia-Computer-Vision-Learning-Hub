<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 15 · OTSU OPTIMAL THRESHOLDING</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Metode Otsu: Memaksimalkan Variansi Antar-Kelas (Between-Class Variance)</text>

  <!-- Bimodal Histogram Plot -->
  <g transform="translate(60, 125)">
    <rect width="380" height="175" rx="8" fill="#090d16" stroke="#334155" />
    <!-- Background Mode -->
    <path d="M 20 155 Q 85 20 150 155" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Foreground Mode -->
    <path d="M 210 155 Q 285 35 355 155" fill="#34d399" fill-opacity="0.35" stroke="#34d399" stroke-width="2.5" />
    <!-- Threshold Line -->
    <line x1="180" y1="20" x2="180" y2="160" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="180" y="18" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">T* Optimal</text>
    <text x="85" y="140" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Background (ω₀, μ₀)</text>
    <text x="285" y="140" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Foreground (ω₁, μ₁)</text>
  </g>

  <!-- Otsu Equation Box -->
  <g transform="translate(480, 125)">
    <rect width="430" height="175" rx="10" fill="#1e293b" stroke="#38bdf8" />
    <text x="24" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Fungsi Objektif Otsu (1979)</text>
    <text x="24" y="72" fill="#f8fafc" font-family="monospace" font-size="14">σ_B²(t) = ω₀(t) · ω₁(t) · [μ₀(t) - μ₁(t)]²</text>
    <text x="24" y="106" fill="#34d399" font-family="monospace" font-size="13">T* = argmax_t { σ_B²(t) }</text>
    <text x="24" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Menemukan ambang pemisah global terbaik secara otomatis</text>
    <text x="24" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">tanpa tuning manual apabila histogram bersifat bimodal.</text>
  </g>
  <text x="924" y="342" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
