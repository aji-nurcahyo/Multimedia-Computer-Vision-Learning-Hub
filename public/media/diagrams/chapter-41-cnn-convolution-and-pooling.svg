<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Operasi Dasar CNN: Konvolusi Spasial & Max Pooling</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Ekstraksi Fitur Hierarkis, Stride, Padding, dan Downsampling</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- Input Tensor -->
        <rect x="40" y="60" width="120" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="45" y="45" fill="#38bdf8" font-size="12">Input (H x W x C)</text>
        <rect x="50" y="70" width="40" height="40" fill="#38bdf8" fill-opacity="0.4" stroke="#60a5fa"/>
        <!-- Kernel -->
        <rect x="200" y="80" width="60" height="60" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5"/>
        <text x="200" y="70" fill="#818cf8" font-size="11">Kernel (k x k)</text>
        <line x1="165" y1="110" x2="195" y2="110" stroke="#64748b" stroke-width="2"/>
        <!-- Feature Map -->
        <rect x="310" y="60" width="120" height="120" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
        <text x="310" y="45" fill="#34d399" font-size="12">Feature Map (Conv)</text>
        <line x1="265" y1="110" x2="305" y2="110" stroke="#64748b" stroke-width="2"/>
        <!-- Pooling -->
        <line x1="435" y1="110" x2="485" y2="110" stroke="#64748b" stroke-width="2"/>
        <rect x="490" y="90" width="60" height="60" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="480" y="75" fill="#f43f5e" font-size="12">Max Pool (2x2)</text>
        <text x="490" y="175" fill="#94a3b8" font-size="10">H/2 x W/2</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>