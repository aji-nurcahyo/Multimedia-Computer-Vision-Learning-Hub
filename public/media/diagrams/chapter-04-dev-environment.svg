<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgDev)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Reproducible Python Multimedia Development Environment</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Arsitektur isolasi virtual environment (venv) untuk mencegah konflik dependensi pustaka ilmiah</text>

  <!-- Left: Global System Python -->
  <g transform="translate(50, 105)">
    <rect width="260" height="235" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#334155" fill-opacity="0.3"/>
    <text x="130" y="23" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sistem Operasi / Global Python</text>

    <text x="20" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Base Python 3.10+ Executable</text>
    <text x="20" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; C:\Python312\python.exe</text>
    <text x="20" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; /usr/bin/python3</text>

    <rect x="20" y="130" width="220" height="85" rx="6" fill="#0f172a" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="130" y="152" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">&#10008; HINDARI GLOBAL PIP INSTALL</text>
    <text x="130" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Rentan merusak paket bawaan OS</text>
    <text x="130" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">dan memicu konflik versi paket</text>
  </g>

  <!-- Middle Arrow -->
  <g transform="translate(325, 205)">
    <path d="M 0 0 L 35 0" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 25 -6 L 35 0 L 25 6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="17" y="-12" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">python -m venv .venv</text>
  </g>

  <!-- Right: Isolated Virtual Environment -->
  <g transform="translate(375, 105)">
    <rect width="535" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="535" height="36" rx="10" fill="#0284c7" fill-opacity="0.25"/>
    <text x="267" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">TERISOLASI: Project Virtual Environment (.venv/)</text>

    <!-- Packages Grid Inside Venv -->
    <g transform="translate(25, 50)">
      <!-- Package 1: NumPy -->
      <g transform="translate(0, 0)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
        <text x="75" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NumPy &gt;= 1.26</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Matriks N-Dimensi &amp; Vektorisasi</text>
      </g>

      <!-- Package 2: OpenCV -->
      <g transform="translate(165, 0)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="75" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OpenCV 4.x</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">opencv-python / headless I/O</text>
      </g>

      <!-- Package 3: Matplotlib -->
      <g transform="translate(330, 0)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="75" y="24" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Matplotlib &gt;= 3.8</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Visualisasi Histogram &amp; Plot</text>
      </g>

      <!-- Package 4: SciPy / SoundFile -->
      <g transform="translate(0, 75)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="75" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SciPy &amp; SoundFile</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Konvolusi Sinyal &amp; Audio WAV</text>
      </g>

      <!-- Package 5: Pillow -->
      <g transform="translate(165, 75)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
        <text x="75" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pillow (PIL)</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Manipulasi Format &amp; EXIF</text>
      </g>

      <!-- Package 6: JupyterLab -->
      <g transform="translate(330, 75)">
        <rect width="150" height="65" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="75" y="24" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Jupyter / Notebook</text>
        <text x="75" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Eksperimen Interaktif .ipynb</text>
      </g>
    </g>

    <text x="267" y="222" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="middle">Pinning Dependensi Terverifikasi via requirements.txt</text>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

