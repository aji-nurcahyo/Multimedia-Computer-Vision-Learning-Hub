      <path d="M 300 320 Q 400 170 500 320" fill="none" stroke="#10b981" stroke-width="2" />
      <path d="M 400 320 Q 500 190 600 320" fill="none" stroke="#f59e0b" stroke-width="2" />
      <g transform="translate(100, 130)">
