  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chapter 18: Komparasi Respons Spektral Rectangular, Hann, Hamming, dan Blackman | Multimedia &amp; Computer Vision Hub - ITERA</text>

  <!-- Main Graphical Content -->
  
      <rect x="60" y="110" width="680" height="280" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
      <path d="M 100 320 Q 200 130 300 320" fill="none" stroke="#ef4444" stroke-width="2" />
