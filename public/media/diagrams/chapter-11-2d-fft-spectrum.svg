<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 11 · 2D FOURIER TRANSFORM &amp; FFTSHIFT</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Pipeline Domain Frekuensi 2D: FFT → fftshift → Filtering → IFFT</text>

  <g transform="translate(45, 130)">
    <rect width="150" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="75" y="46" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">f(x, y)</text>
    <text x="75" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Citra Spasial</text>
  </g>
  <text x="215" y="190" fill="#38bdf8" font-family="monospace" font-size="20" text-anchor="middle">→</text>

  <g transform="translate(235, 130)">
    <rect width="175" height="110" rx="8" fill="#1e293b" stroke="#a78bfa" />
    <text x="88" y="42" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">F(u, v) = FFT2(f)</text>
    <text x="88" y="66" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">+ fftshift()</text>
    <text x="88" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">DC Center (0,0)</text>
  </g>
  <text x="430" y="190" fill="#38bdf8" font-family="monospace" font-size="20" text-anchor="middle">×</text>

  <g transform="translate(450, 130)">
    <rect width="170" height="110" rx="8" fill="#090d16" stroke="#f59e0b" />
    <circle cx="85" cy="48" r="24" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2" />
    <text x="85" y="53" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">H(u,v)</text>
    <text x="85" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LPF / HPF Mask</text>
  </g>
  <text x="640" y="190" fill="#38bdf8" font-family="monospace" font-size="20" text-anchor="middle">→</text>

  <g transform="translate(660, 130)">
    <rect width="245" height="110" rx="8" fill="#1e293b" stroke="#34d399" />
    <text x="122" y="42" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">g(x,y) = Re{IFFT2(H·F)}</text>
    <text x="122" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Teorema Konvolusi Frekuensi:</text>
    <text x="122" y="92" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">f(x,y) * h(x,y) ⇔ F(u,v) · H(u,v)</text>
  </g>

  <text x="480" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Visualisasi spektrum memakai transformasi logaritmik S(u,v) = c · log(1 + |F(u,v)|) agar komponen frekuensi tinggi terlihat jelas.</text>
  <text x="924" y="344" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
