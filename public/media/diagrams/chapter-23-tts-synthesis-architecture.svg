  <text x="50" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Arsitektur Sintesis Suara Text-to-Speech (TTS)</text>
  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chapter 23: Front-End Pemrosesan Teks, Acoustic Model, dan Neural Vocoder | Multimedia &amp; Computer Vision Hub - ITERA</text>

  <!-- Main Graphical Content -->
  
      <g transform="translate(60, 140)">
        <rect width="200" height="120" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
        <text x="100" y="40" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">1. Text Normalizer</text>
