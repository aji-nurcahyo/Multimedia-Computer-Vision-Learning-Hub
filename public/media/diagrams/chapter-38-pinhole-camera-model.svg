<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Model Kamera Pinhole & Matriks Intrinsik K</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Proyeksi Titik 3D Dunia Menjadi Koordinat Piksel Sensor 2D</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- 3D Object -->
        <circle cx="100" cy="80" r="6" fill="#38bdf8"/>
        <text x="80" y="65" fill="#38bdf8" font-size="12">P(X, Y, Z)</text>
        <!-- Center of projection (pinhole) -->
        <circle cx="340" cy="170" r="4" fill="#fbbf24"/>
        <text x="310" y="195" fill="#fbbf24" font-size="12">Pinhole (C)</text>
        <!-- Rays -->
        <line x1="100" y1="80" x2="340" y2="170" stroke="#94a3b8" stroke-dasharray="3"/>
        <line x1="340" y1="170" x2="560" y2="250" stroke="#94a3b8" stroke-dasharray="3"/>
        <!-- Image Plane -->
        <line x1="480" y1="60" x2="480" y2="240" stroke="#f43f5e" stroke-width="2"/>
        <text x="460" y="50" fill="#f43f5e" font-size="12">Image Plane</text>
        <circle cx="480" cy="222" r="5" fill="#34d399"/>
        <text x="500" y="225" fill="#34d399" font-size="12">p(u, v)</text>
        <!-- Focal length arrow -->
        <line x1="340" y1="230" x2="480" y2="230" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="390" y="220" fill="#fbbf24" font-size="11">Focal Length f</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>