<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="16" fill="url(#bg2)" />

  <text x="40" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">2D Gaussian Distribution &amp; Separability Property</text>
  <text x="40" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">G(x,y) = G(x) &#183; G(y) &#8212; Reduksi kompleksitas komputasi dari O(K&#178;) menjadi O(2K) per piksel</text>

  <!-- Left: Continuous Bell curve representation -->
  <g transform="translate(60, 110)">
    <rect width="380" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="190" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Kontinu: Distribusi Normal Gaussian 2D</text>
    
    <!-- Axes -->
    <line x1="50" y1="180" x2="330" y2="180" stroke="#64748b" stroke-width="1.5"/>
    <line x1="190" y1="180" x2="190" y2="45" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Bell Curve shape -->
    <path d="M 50 180 C 110 180, 140 60, 190 60 C 240 60, 270 180, 330 180 Z" fill="url(#bellGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Formula label -->
    <text x="190" y="212" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">G(x,y) = (1 / 2&#960;&#963;&#178;) exp(-(x&#178; + y&#178;) / 2&#963;&#178;)</text>
    <text x="190" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#963; (Standar Deviasi)</text>
  </g>

  <!-- Right: Separable 1D kernels multiplied -->
  <g transform="translate(480, 110)">
    <rect width="420" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Sifat Separabilitas: 1D Horizontal &#215; 1D Vertikal</text>

    <!-- 1D Column -->
    <g transform="translate(40, 60)">
      <rect width="50" height="120" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="32" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">0.279</text>
      <text x="25" y="70" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">0.442</text>
      <text x="25" y="108" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">0.279</text>
      <text x="25" y="140" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">G(y)</text>
    </g>

    <text x="115" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">&#8855;</text>

    <!-- 1D Row -->
    <g transform="translate(140, 95)">
      <rect width="130" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="30" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">0.279</text>
      <text x="65" y="30" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">0.442</text>
      <text x="105" y="30" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">0.279</text>
      <text x="65" y="70" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">G(x)</text>
    </g>

    <text x="295" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">=</text>

    <!-- 3x3 Discrete Result -->
    <g transform="translate(320, 60)">
      <rect width="80" height="120" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="40" y="30" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="middle">0.078  0.123  0.078</text>
      <text x="40" y="68" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.123  0.195  0.123</text>
      <text x="40" y="106" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="middle">0.078  0.123  0.078</text>
      <text x="40" y="140" fill="#bae6fd" font-family="monospace" font-size="11" text-anchor="middle">2D G(x,y)</text>
    </g>
  </g>

  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Multimedia &amp; Computer Vision Learning Hub &#183; Aji Pamungkas Tri Nurcahyo (ITERA)</text>
</svg>

