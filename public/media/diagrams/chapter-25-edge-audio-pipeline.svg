  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chapter 25: Optimasi Model TinyML, Kuantisasi INT8, dan Inferensi Hemat Daya | Multimedia &amp; Computer Vision Hub - ITERA</text>

  <!-- Main Graphical Content -->
  
