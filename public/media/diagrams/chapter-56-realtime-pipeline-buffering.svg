<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Arsitektur Pipeline Multimedia Real-Time &amp; Buffer Queue</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Struktur Multi-Thread Asinkron: Thread Akuisisi, Circular Ring Buffer, Thread Komputasi, dan Render</text>
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <g transform="translate(40, 100)">
    <!-- Stage 1: Capture Thread -->
    <rect x="0" y="20" width="150" height="220" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="10" y="30" width="130" height="28" rx="4" fill="#0284c7" />
    <text x="75" y="49" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Capture Thread</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Camera Sensor / RTSP</text>
    <text x="15" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Fixed Arrival rate λ</text>
    <text x="15" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Non-blocking IO</text>
    <text x="15" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Timestamp Tagging</text>
    <rect x="15" y="180" width="120" height="45" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="75" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">T_capture ~ 2–5 ms</text>
    <text x="75" y="214" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Zero-Copy DMA Buffer</text>

    <!-- Arrow 1 to Buffer -->
    <line x1="150" y1="130" x2="195" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="195,130 187,125 187,135" fill="#38bdf8" />

    <!-- Stage 2: Queue / Ring Buffer -->
    <rect x="200" y="20" width="150" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="210" y="30" width="130" height="28" rx="4" fill="#d97706" />
    <text x="275" y="49" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Queue Buffer</text>
    <text x="215" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Circular Frame Buffer</text>
    <text x="215" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Queue Capacity N_max</text>
    <text x="215" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Backpressure Control</text>
    <text x="215" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">• Drop oldest if full</text>
    <rect x="215" y="180" width="120" height="45" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="275" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">T_queue = Q / μ</text>
    <text x="275" y="214" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Jitter Absorber</text>

    <!-- Arrow 2 to Worker -->
    <line x1="350" y1="130" x2="395" y2="130" stroke="#f59e0b" stroke-width="2" />
    <polygon points="395,130 387,125 387,135" fill="#f59e0b" />

    <!-- Stage 3: Vision Worker Thread -->
    <rect x="400" y="20" width="150" height="220" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="410" y="30" width="130" height="28" rx="4" fill="#6366f1" />
    <text x="475" y="49" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Worker Thread</text>
    <text x="415" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Preprocessing (Resize)</text>
    <text x="415" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• DNN / CV Inference</text>
    <text x="415" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Service Rate μ FPS</text>
    <text x="415" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Postprocess &amp; Track</text>
    <rect x="415" y="180" width="120" height="45" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="475" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#818cf8" text-anchor="middle">T_proc ~ 8–18 ms</text>
    <text x="475" y="214" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Parallel Thread Pool</text>

    <!-- Arrow 3 to Render -->
    <line x1="550" y1="130" x2="595" y2="130" stroke="#818cf8" stroke-width="2" />
    <polygon points="595,130 587,125 587,135" fill="#818cf8" />

    <!-- Stage 4: Render / Output -->
    <rect x="600" y="20" width="140" height="220" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <rect x="610" y="30" width="120" height="28" rx="4" fill="#059669" />
    <text x="670" y="49" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Display / Stream</text>
    <text x="615" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Canvas / OpenGL</text>
    <text x="615" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Overlay Bounding Box</text>
    <text x="615" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• VSync Synchronization</text>
    <text x="615" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Real-time Metrics</text>
    <rect x="610" y="180" width="120" height="45" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="670" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">T_render ~ 1–3 ms</text>
    <text x="670" y="214" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Zero Glitch Delivery</text>
  </g>

  <!-- Formula Card at Bottom -->
  <g transform="translate(40, 360)">
    <rect width="720" height="55" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Persamaan Total Latensi Real-Time:</text>
    <text x="20" y="44" font-family="monospace" font-size="12" fill="#38bdf8">T_total = T_capture + T_queue + T_proc + T_render ≤ T_deadline (16.67 ms untuk 60 FPS)</text>
    <text x="560" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Drop: max(0, λ - μ) / λ</text>
  </g>

  <text x="400" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Multimedia &amp; Computer Vision Learning Hub • Institut Teknologi Sumatera (ITERA)</text>
</svg>

