<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <rect width="960" height="360" rx="16" fill="#0f172a" />
  <rect x="36" y="24" width="350" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="48" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CH 14 · MORPHOLOGICAL OPERATIONS</text>
  <text x="36" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Operasi Dasar Morfologi Biner: Erosion, Dilation, Opening &amp; Closing</text>

  <g transform="translate(45, 125)">
    <rect width="205" height="175" rx="8" fill="#1e293b" stroke="#ef4444" />
    <text x="102" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Erosion (A ⊖ B)</text>
    <rect x="65" y="65" width="74" height="54" fill="none" stroke="#64748b" stroke-dasharray="4,3" />
    <rect x="77" y="75" width="50" height="34" fill="#ef4444" fill-opacity="0.7" />
    <text x="102" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Menyusutkan objek &amp; hapus noise</text>
  </g>

  <g transform="translate(270, 125)">
    <rect width="205" height="175" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="102" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Dilation (A ⊕ B)</text>
    <rect x="60" y="62" width="84" height="62" fill="#38bdf8" fill-opacity="0.4" stroke="#38bdf8" />
    <rect x="75" y="75" width="54" height="36" fill="none" stroke="#f8fafc" stroke-dasharray="4,3" />
    <text x="102" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Memperluas &amp; menyambung celah</text>
  </g>

  <g transform="translate(495, 125)">
    <rect width="205" height="175" rx="8" fill="#1e293b" stroke="#34d399" />
    <text x="102" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Opening (A ∘ B)</text>
    <text x="102" y="66" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">(A ⊖ B) ⊕ B</text>
    <text x="102" y="102" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Hapus titik noise kecil,</text>
    <text x="102" y="122" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ukuran objek tetap utuh</text>
  </g>

  <g transform="translate(720, 125)">
    <rect width="205" height="175" rx="8" fill="#1e293b" stroke="#f59e0b" />
    <text x="102" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Closing (A • B)</text>
    <text x="102" y="66" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">(A ⊕ B) ⊖ B</text>
    <text x="102" y="102" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Menutup lubang kecil</text>
    <text x="102" y="122" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">di dalam foreground</text>
  </g>
  <text x="924" y="342" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ITERA · Aji Pamungkas Tri Nurcahyo (CC-BY-4.0)</text>
</svg>
