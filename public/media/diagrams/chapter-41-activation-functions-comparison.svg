<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Fungsi Aktivasi Non-Linier: ReLU, Sigmoid & Tanh</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Mitigasi Masalah Vanishing Gradient pada Pelatihan Jaringan Saraf Dalam</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(60, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="20" y="30" fill="#34d399" font-size="14" font-weight="bold">Rectified Linear Unit (ReLU)</text>
        <!-- ReLU plot -->
        <line x1="50" y1="180" x2="270" y2="180" stroke="#64748b" stroke-width="1.5"/>
        <line x1="160" y1="220" x2="160" y2="60" stroke="#64748b" stroke-width="1.5"/>
        <path d="M 50,180 L 160,180 L 250,90" fill="none" stroke="#34d399" stroke-width="3"/>
        <text x="20" y="240" fill="#e2e8f0" font-family="monospace" font-size="12">f(x) = max(0, x)</text>
      </g>
      <g transform="translate(420, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="bold">Sigmoid vs Leaky ReLU</text>
        <line x1="50" y1="180" x2="270" y2="180" stroke="#64748b" stroke-width="1.5"/>
        <line x1="160" y1="220" x2="160" y2="60" stroke="#64748b" stroke-width="1.5"/>
        <!-- Sigmoid S-curve -->
        <path d="M 60,175 Q 140,175 160,140 Q 180,105 260,105" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
        <text x="20" y="240" fill="#e2e8f0" font-family="monospace" font-size="12">σ(x) = 1 / (1 + e^-x)</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>