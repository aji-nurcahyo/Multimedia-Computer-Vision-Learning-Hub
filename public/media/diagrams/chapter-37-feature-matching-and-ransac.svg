<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Pencocokan Fitur & Penolakan Outlier via RANSAC</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Lowe Ratio Test dan Konsensus Estimasi Homografi</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <rect x="40" y="40" width="180" height="180" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="80" y="30" fill="#38bdf8" font-size="12" font-weight="bold">Citra Kueri (Left)</text>
        <rect x="480" y="40" width="180" height="180" rx="6" fill="#0f172a" stroke="#818cf8"/>
        <text x="520" y="30" fill="#818cf8" font-size="12" font-weight="bold">Citra Target (Right)</text>
        <!-- Inliers (green lines) -->
        <circle cx="80" cy="80" r="4" fill="#10b981"/>
        <circle cx="520" cy="90" r="4" fill="#10b981"/>
        <line x1="80" y1="80" x2="520" y2="90" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="160" cy="140" r="4" fill="#10b981"/>
        <circle cx="600" cy="150" r="4" fill="#10b981"/>
        <line x1="160" y1="140" x2="600" y2="150" stroke="#10b981" stroke-width="1.5"/>
        <!-- Outlier (red line) -->
        <circle cx="120" cy="180" r="4" fill="#f43f5e"/>
        <circle cx="510" cy="60" r="4" fill="#f43f5e"/>
        <line x1="120" y1="180" x2="510" y2="60" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4"/>
        <text x="250" y="100" fill="#10b981" font-size="11">Inlier (Konsisten Homografi H)</text>
        <text x="250" y="170" fill="#f43f5e" font-size="11">Outlier (Dieliminasi RANSAC)</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>