<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Ruang Vektor Embedding Bersama (Joint Embedding Space)</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Kedekatan Geometri Vektor Representasi Visual dan Teks Bahasa Alami</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(60, 110)">
        <rect width="680" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- Clustered vectors -->
        <circle cx="200" cy="120" r="50" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-dasharray="3"/>
        <circle cx="190" cy="110" r="6" fill="#38bdf8"/>
        <text x="140" y="95" fill="#38bdf8" font-size="11">Foto Kucing</text>
        <circle cx="215" cy="130" r="6" fill="#818cf8"/>
        <text x="225" y="145" fill="#818cf8" font-size="11">Teks: "Seekor kucing"</text>
        <circle cx="480" cy="150" r="50" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-dasharray="3"/>
        <circle cx="470" cy="140" r="6" fill="#34d399"/>
        <text x="430" y="125" fill="#34d399" font-size="11">Foto Mobil</text>
        <circle cx="495" cy="160" r="6" fill="#f59e0b"/>
        <text x="505" y="175" fill="#f59e0b" font-size="11">Teks: "Mobil sedan"</text>
        <text x="240" y="240" fill="#94a3b8" font-size="11">Jarak Kosinus Rendah Antara Konsep Semantik yang Sama</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>