<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Geometri Triangulasi Titik 3D Multi-Kamera</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Rekonstruksi Koordinat Dunia dari Perpotongan Sinar Optis Kamera Kalibrasi</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(60, 110)">
        <rect width="680" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <circle cx="160" cy="200" r="8" fill="#38bdf8"/>
        <text x="140" y="230" fill="#38bdf8" font-size="12">Kamera C1 [R1|t1]</text>
        <circle cx="520" cy="200" r="8" fill="#818cf8"/>
        <text x="500" y="230" fill="#818cf8" font-size="12">Kamera C2 [R2|t2]</text>
        <circle cx="340" cy="50" r="8" fill="#34d399"/>
        <text x="330" y="35" fill="#34d399" font-size="13" font-weight="bold">X_3D</text>
        <!-- Rays -->
        <line x1="160" y1="200" x2="340" y2="50" stroke="#38bdf8" stroke-width="2"/>
        <line x1="520" y1="200" x2="340" y2="50" stroke="#818cf8" stroke-width="2"/>
        <text x="240" y="160" fill="#fbbf24" font-size="11">Sinar Proyeksi S1</text>
        <text x="400" y="160" fill="#fbbf24" font-size="11">Sinar Proyeksi S2</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>