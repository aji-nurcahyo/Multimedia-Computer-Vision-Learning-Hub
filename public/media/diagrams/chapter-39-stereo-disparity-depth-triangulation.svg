<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Triangulasi Disparitas & Estimasi Kedalaman Stereo</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Hubungan Terbalik Antara Disparitas d dan Kedalaman Z (Z = f·B / d)</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(60, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="bold">Formulasi Disparitas d</text>
        <text x="20" y="70" fill="#e2e8f0" font-family="monospace" font-size="14">d = x_Left - x_Right</text>
        <text x="20" y="110" fill="#34d399" font-family="monospace" font-size="14">Z = (f · B) / d</text>
        <rect x="20" y="140" width="280" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="30" y="165" fill="#94a3b8" font-size="11">• d besar ➔ Objek dekat dengan kamera</text>
        <text x="30" y="190" fill="#94a3b8" font-size="11">• d kecil ➔ Objek jauh dari kamera</text>
        <text x="30" y="215" fill="#f43f5e" font-size="11">• d = 0 ➔ Objek di tak terhingga (Z = ∞)</text>
      </g>
      <g transform="translate(420, 110)">
        <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <text x="20" y="30" fill="#a855f7" font-size="14" font-weight="bold">Peta Disparitas (Disparity Map)</text>
        <rect x="40" y="60" width="240" height="150" rx="6" fill="#0f172a" stroke="#64748b"/>
        <!-- Heatmap colors -->
        <circle cx="120" cy="130" r="30" fill="#f43f5e" fill-opacity="0.8"/>
        <text x="100" y="135" fill="#fff" font-size="10">Dekat (Tinggi)</text>
        <circle cx="210" cy="110" r="20" fill="#3b82f6" fill-opacity="0.6"/>
        <text x="195" y="115" fill="#fff" font-size="9">Jauh</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>