<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowP1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="14" fill="url(#bgP1)"/>

  <!-- Title Badge -->
  <rect x="40" y="24" width="310" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MULTIMEDIA &amp; COMPUTER VISION HUB</text>
  
  <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">End-to-End Multimedia Processing Pipeline</text>
  <text x="40" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Alur tahapan konversi sinyal fisik dunia nyata menjadi representasi data, komputasi cerdas, dan keluaran sistem</text>

  <!-- Step 1: Physical World & Acquisition -->
  <g transform="translate(40, 130)" filter="url(#shadowP1)">
    <rect width="125" height="180" rx="8" fill="url(#boxGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="62" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. ACQUISITION</text>
    <text x="62" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Physical Signals</text>
    <text x="62" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Light / Photons</text>
    <text x="62" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Acoustic Waves</text>
    <text x="62" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Video Stream</text>
    <rect x="15" y="148" width="95" height="20" rx="4" fill="#0369a1" fill-opacity="0.3"/>
    <text x="62" y="162" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Sensors (CMOS/Mic)</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 170 220 L 195 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Representation -->
  <g transform="translate(200, 130)" filter="url(#shadowP1)">
    <rect width="125" height="180" rx="8" fill="url(#boxGrad1)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="62" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. DIGITIZATION</text>
    <text x="62" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Representation</text>
    <text x="62" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Sampling (Nyquist)</text>
    <text x="62" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Quantization</text>
    <text x="62" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Raw Bitstreams</text>
    <rect x="15" y="148" width="95" height="20" rx="4" fill="#065f46" fill-opacity="0.3"/>
    <text x="62" y="162" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Discrete Matrix/Array</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 330 220 L 355 220" stroke="#34d399" stroke-width="2"/>

  <!-- Step 3: Enhancement & Filtering -->
  <g transform="translate(360, 130)" filter="url(#shadowP1)">
    <rect width="125" height="180" rx="8" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#d97706" fill-opacity="0.2"/>
    <text x="62" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. PRE-PROCESS</text>
    <text x="62" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Enhancement</text>
    <text x="62" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Spatial Filtering</text>
    <text x="62" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Noise Reduction</text>
    <text x="62" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Histogram Equalize</text>
    <rect x="15" y="148" width="95" height="20" rx="4" fill="#78350f" fill-opacity="0.3"/>
    <text x="62" y="162" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pixel-in &#8594; Pixel-out</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 490 220 L 515 220" stroke="#f59e0b" stroke-width="2"/>

  <!-- Step 4: Feature Extraction -->
  <g transform="translate(520, 130)" filter="url(#shadowP1)">
    <rect width="125" height="180" rx="8" fill="url(#boxGrad1)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="62" y="22" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. EXTRACTION</text>
    <text x="62" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Features &amp; Repr.</text>
    <text x="62" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Edges / Corners</text>
    <text x="62" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; MFCC Audio Spec</text>
    <text x="62" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Optical Flow Vectors</text>
    <rect x="15" y="148" width="95" height="20" rx="4" fill="#4c1d95" fill-opacity="0.3"/>
    <text x="62" y="162" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Feature Descriptors</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 650 220 L 675 220" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Step 5: Intelligence / Understanding -->
  <g transform="translate(680, 130)" filter="url(#shadowP1)">
    <rect width="125" height="180" rx="8" fill="url(#boxGrad1)" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#db2777" fill-opacity="0.2"/>
    <text x="62" y="22" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5. INFERENCE</text>
    <text x="62" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI &amp; Vision</text>
    <text x="62" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; CNN / YOLO Det.</text>
    <text x="62" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Speech-to-Text</text>
    <text x="62" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Multimodal Fusion</text>
    <rect x="15" y="148" width="95" height="20" rx="4" fill="#831843" fill-opacity="0.3"/>
    <text x="62" y="162" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Semantic Knowledge</text>
  </g>

  <!-- Arrow 5-6 -->
  <path d="M 810 220 L 830 220" stroke="#ec4899" stroke-width="2"/>

  <!-- Step 6: Presentation / Action -->
  <g transform="translate(835, 130)" filter="url(#shadowP1)">
    <rect width="85" height="180" rx="8" fill="url(#boxGrad1)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="42" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6. ACTION</text>
    <text x="42" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Display UI</text>
    <text x="42" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Actuator</text>
    <text x="42" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Web API</text>
    <text x="42" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&#8226; Storage</text>
  </g>

  <!-- Footer attribution -->
  <text x="40" y="395" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

