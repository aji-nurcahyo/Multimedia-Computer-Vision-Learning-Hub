<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgQuant)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Uniform Quantization &amp; Bit-Depth Resolution</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Pembagian rentang amplitudo kontinu menjadi 2^b level diskrit berjarak &#916; dan efek derau kuantisasi (SQNR)</text>

  <!-- Left: Quantization Staircase Mapping -->
  <g transform="translate(45, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Karakteristik Transfer Kuantisasi Seragam (3-Bit)</text>
    <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total level L = 2^3 = 8 level, Ukuran langkah &#916; = (Vmax - Vmin) / 8</text>

    <!-- Axes -->
    <line x1="50" y1="210" x2="380" y2="210" stroke="#475569" stroke-width="1.5"/>
    <line x1="50" y1="65" x2="50" y2="210" stroke="#475569" stroke-width="1.5"/>
    <text x="375" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Vin (Amplitudo Kontinu)</text>
    <text x="55" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Vout (Level Diskrit)</text>

    <!-- Continuous diagonal line (reference) -->
    <line x1="50" y1="210" x2="350" y2="70" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Staircase steps (3-bit / 8 levels) -->
    <g stroke="#38bdf8" stroke-width="2.5" fill="none">
      <path d="M 50 210 L 87.5 210 L 87.5 192.5 L 125 192.5 L 125 175 L 162.5 175 L 162.5 157.5 L 200 157.5 L 200 140 L 237.5 140 L 237.5 122.5 L 275 122.5 L 275 105 L 312.5 105 L 312.5 87.5 L 350 87.5"/>
    </g>

    <!-- Delta annotation -->
    <line x1="200" y1="140" x2="200" y2="157.5" stroke="#f59e0b" stroke-width="2"/>
    <text x="210" y="152" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">&#916;</text>

    <text x="205" y="235" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="middle">Error e[n] = Q(x) - x &#8712; [-&#916;/2, +&#916;/2]</text>
  </g>

  <!-- Right: Bit-Depth Comparison & SQNR Equation -->
  <g transform="translate(500, 100)">
    <rect width="415" height="240" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Resolusi Kedalaman Bit (Bit Depth) &amp; Dynamic Range</text>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="375" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1-Bit (Biner):</text>
      <text x="15" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">2 level intensitas (Hitam / Putih murni) &#8212; Siluet tanpa gradasi</text>

      <rect x="0" y="50" width="375" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="68" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">8-Bit (Standar Citra uint8):</text>
      <text x="15" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">256 level per saluran &#8212; 16.7 Juta warna (24-bit TrueColor)</text>

      <rect x="0" y="100" width="375" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="118" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">16-Bit / 24-Bit (Audio Studio PCM):</text>
      <text x="15" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">65.536 level (CD Audio) &#8212; SQNR &#8776; 98 dB (Nyaris tanpa desis)</text>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="212" width="375" height="22" rx="4" fill="#064e3b" fill-opacity="0.5"/>
    <text x="207" y="227" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SQNR &#8776; 6.02 &#183; b + 1.76 dB (Aturan 6 dB per Bit)</text>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

