<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Trade-off Platform Komputasi Vision: Edge vs Cloud</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Perbandingan Arsitektur: MCU (TinyML), SBC/Edge GPU (Jetson), Dedicated NPU (Coral), dan Cloud Server</text>
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <g transform="translate(40, 100)">
    <!-- Column 1: Microcontroller (MCU) -->
    <rect x="0" y="10" width="165" height="235" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <rect x="10" y="20" width="145" height="26" rx="4" fill="#0284c7" />
    <text x="82" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">TinyML / MCU (ESP32-S3)</text>
    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Daya: &lt; 1 Watt (Baterai)</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Memori: 512 KB–8 MB</text>
    <text x="15" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Throughput: 1–5 FPS</text>
    <text x="15" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Model: MobileNet-V1 0.25</text>
    <text x="15" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">• Biaya: $5 – $15</text>
    <rect x="10" y="195" width="145" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="82" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">Ultra-Low Power</text>
    <text x="82" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Deteksi Kehadiran / Sensor</text>

    <!-- Column 2: Edge NPU / Coral -->
    <rect x="185" y="10" width="165" height="235" rx="8" fill="#1e293b" stroke="#34d399" />
    <rect x="195" y="20" width="145" height="26" rx="4" fill="#059669" />
    <text x="267" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Edge NPU (Google Coral)</text>
    <text x="200" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Daya: ~2 Watt (Hemat)</text>
    <text x="200" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Komputasi: 4 TOPS INT8</text>
    <text x="200" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Throughput: 30–60 FPS</text>
    <text x="200" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Format: EdgeTPU INT8</text>
    <text x="200" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">• Biaya: $60 – $80</text>
    <rect x="195" y="195" width="145" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="267" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Efisiensi Energi Maksimal</text>
    <text x="267" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Vision AI Real-Time Edge</text>

    <!-- Column 3: Edge GPU (Jetson Nano / Orin) -->
    <rect x="370" y="10" width="165" height="235" rx="8" fill="#1e293b" stroke="#f59e0b" />
    <rect x="380" y="20" width="145" height="26" rx="4" fill="#d97706" />
    <text x="452" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Edge GPU (Jetson Orin)</text>
    <text x="385" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Daya: 5–25 Watt</text>
    <text x="385" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Memori: 4 GB–16 GB</text>
    <text x="385" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Throughput: 40–120 FPS</text>
    <text x="385" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Framework: TensorRT FP16/INT8</text>
    <text x="385" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b">• Biaya: $150 – $500</text>
    <rect x="380" y="195" width="145" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="452" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Fleksibilitas Model Tinggi</text>
    <text x="452" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Autonomous &amp; Multitask</text>

    <!-- Column 4: Cloud Server -->
    <rect x="555" y="10" width="165" height="235" rx="8" fill="#1e293b" stroke="#818cf8" />
    <rect x="565" y="20" width="145" height="26" rx="4" fill="#6366f1" />
    <text x="637" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Cloud GPU (A100 / H100)</text>
    <text x="570" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Daya: 300–700 Watt</text>
    <text x="570" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Memori: 40–80 GB VRAM</text>
    <text x="570" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">• Latensi: +50–150ms Network</text>
    <text x="570" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Model: Foundation LLM / ViT</text>
    <text x="570" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#818cf8">• Biaya: Berlangganan Cloud</text>
    <rect x="565" y="195" width="145" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="637" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#818cf8" text-anchor="middle">Kapasitas Skala Besar</text>
    <text x="637" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Analisis Agregat / Batch</text>
  </g>

  <!-- Bottom Comparison Takeaway -->
  <g transform="translate(40, 360)">
    <rect width="720" height="55" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Prinsip Desain Edge Computer Vision:</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Pemrosesan lokal pada Edge NPU/GPU menjamin <tspan fill="#34d399">latensi deterministik rendah (&lt;20 ms)</tspan>, menjaga <tspan fill="#38bdf8">privasi visual pengguna</tspan>, dan menghemat <tspan fill="#f59e0b">biaya bandwidth jaringan</tspan>.</text>
  </g>

  <text x="400" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Multimedia &amp; Computer Vision Learning Hub • Institut Teknologi Sumatera (ITERA)</text>
</svg>

