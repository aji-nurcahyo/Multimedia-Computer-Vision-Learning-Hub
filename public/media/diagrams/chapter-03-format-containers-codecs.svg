<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCont" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bgCont)"/>

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Multimedia Architecture: Containers, Codecs &amp; Streams</text>
  <text x="40" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Perbedaan mendasar antara wadah pembungkus (Container) dan algoritma kompresi-dekompresi (Codec)</text>

  <!-- Container Box (e.g. MP4 / MKV / WebM) -->
  <g transform="translate(60, 95)">
    <rect width="840" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="840" height="36" rx="12" fill="#0284c7" fill-opacity="0.25"/>
    <text x="30" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Wadah Berkas Multimedia (Container Format): .MP4 / .MKV / .WebM / .AVI</text>
    <text x="810" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Multiplexed Envelope</text>

    <!-- Sub-stream 1: Video Codec -->
    <g transform="translate(30, 50)">
      <rect width="240" height="175" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="0" y="0" width="240" height="28" rx="8" fill="#d97706" fill-opacity="0.2"/>
      <text x="120" y="19" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VIDEO STREAM (Track 0)</text>

      <text x="15" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Video Codec Kompresi:</text>
      <text x="15" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; H.264 / AVC (Kompatibilitas Luas)</text>
      <text x="15" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; H.265 / HEVC (High Efficiency 4K)</text>
      <text x="15" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; AV1 / VP9 (Royalty-Free Open)</text>

      <rect x="15" y="140" width="210" height="22" rx="4" fill="#78350f" fill-opacity="0.4"/>
      <text x="120" y="155" fill="#fde68a" font-family="monospace" font-size="10" text-anchor="middle">Spatial DCT + Temporal Inter-frame</text>
    </g>

    <!-- Sub-stream 2: Audio Codec -->
    <g transform="translate(300, 50)">
      <rect width="240" height="175" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="240" height="28" rx="8" fill="#059669" fill-opacity="0.2"/>
      <text x="120" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AUDIO STREAM (Track 1)</text>

      <text x="15" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Audio Codec Kompresi:</text>
      <text x="15" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; AAC-LC (MPEG-4 Audio Standar)</text>
      <text x="15" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Opus (Ultra-low latency web/VoIP)</text>
      <text x="15" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; FLAC / PCM WAV (Lossless)</text>

      <rect x="15" y="140" width="210" height="22" rx="4" fill="#064e3b" fill-opacity="0.4"/>
      <text x="120" y="155" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">MDCT + Psychoacoustic Masking</text>
    </g>

    <!-- Sub-stream 3: Metadata & Subtitles -->
    <g transform="translate(570, 50)">
      <rect width="240" height="175" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="0" y="0" width="240" height="28" rx="8" fill="#7c3aed" fill-opacity="0.2"/>
      <text x="120" y="19" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">METADATA &amp; TIMING</text>

      <text x="15" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Header &amp; Informasi Samping:</text>
      <text x="15" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Timecode Synchronization (A/V Sync)</text>
      <text x="15" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; EXIF / Camera GPS / Geolocation</text>
      <text x="15" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&#8226; Subtitles (SRT / VTT / PGS)</text>

      <rect x="15" y="140" width="210" height="22" rx="4" fill="#4c1d95" fill-opacity="0.4"/>
      <text x="120" y="155" fill="#ddd6fe" font-family="monospace" font-size="10" text-anchor="middle">PTS / DTS Timestamps &amp; Atom Tags</text>
    </g>
  </g>

  <!-- Attribution footer -->
  <text x="40" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Multimedia &amp; Computer Vision Learning Hub &#183; Institut Teknologi Sumatera (ITERA) &#183; Aji Pamungkas Tri Nurcahyo</text>
</svg>

