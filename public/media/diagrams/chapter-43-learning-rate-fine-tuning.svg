<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="10" />

  <!-- Title & Subtitle -->
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Penjadwalan Learning Rate & Kurva Konvergensi Transfer Learning</text>
  <text x="30" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Pencegahan Catastrophic Forgetting pada Bobot Pretrained ImageNet</text>

  <!-- Header Divider -->
  <line x1="30" y1="78" x2="770" y2="78" stroke="#334155" stroke-width="1" />

  <!-- Diagram Graphics Content -->
  
      <g transform="translate(50, 110)">
        <rect width="700" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <!-- Chart axes -->
        <line x1="60" y1="210" x2="640" y2="210" stroke="#64748b" stroke-width="2"/>
        <line x1="60" y1="210" x2="60" y2="40" stroke="#64748b" stroke-width="2"/>
        <text x="610" y="235" fill="#94a3b8" font-size="12">Epoch</text>
        <text x="20" y="50" fill="#94a3b8" font-size="12">Akurasi</text>
        <!-- Scratch training (slow, blue) -->
        <path d="M 60,205 Q 200,195 350,150 T 640,110" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5"/>
        <text x="480" y="130" fill="#60a5fa" font-size="11">Dari Awal (Scratch - Lambat)</text>
        <!-- Transfer Learning (fast, green) -->
        <path d="M 60,140 Q 150,75 300,65 T 640,55" fill="none" stroke="#10b981" stroke-width="3"/>
        <text x="350" y="55" fill="#34d399" font-size="12" font-weight="bold">Transfer Learning (Konvergensi Cepat)</text>
      </g>
    

  <!-- Footer / Attribution -->
  <line x1="30" y1="418" x2="770" y2="418" stroke="#334155" stroke-width="1" />
  <text x="30" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Multimedia &amp; Computer Vision Hub · Institut Teknologi Sumatera (ITERA) · Aji Pamungkas Tri Nurcahyo</text>
  <text x="770" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">CC-BY-4.0 License</text>
</svg>